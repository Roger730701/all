<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nobel Biocare 行銷品訂購單</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC',sans-serif;background:#f5f5f5;color:#1a1a1a;padding-bottom:96px}
header{background:#fff;border-bottom:2px solid #cc0000;padding:16px 16px 12px;position:sticky;top:0;z-index:30}
.h-row{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto}
.logo{width:30px;height:30px;flex-shrink:0}
h1{font-size:18px;font-weight:800;letter-spacing:1px}
.sub{font-size:12px;color:#666;margin-top:2px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}

/* 表頭資料 */
.form-card{background:#fff;border:1.5px solid #e0e0e0;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:12px;font-weight:700;color:#555;margin-bottom:5px}
input[type=text],input[type=date],textarea,select{width:100%;padding:9px 11px;border:1.5px solid #ddd;border-radius:9px;font-size:15px;font-family:inherit;background:#fff;color:#1a1a1a}
input:focus,textarea:focus{outline:none;border-color:#cc0000}
.req::after{content:' *';color:#cc0000}
.hint{font-size:11px;color:#888;margin-top:4px}
.hint.ok{color:#1a7f37}.hint.warn{color:#cc7000}

/* 搜尋 */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.search{flex:1;min-width:180px}
.btn{border:1.5px solid #ddd;background:#fff;color:#333;border-radius:9px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn-primary{background:#cc0000;border-color:#cc0000;color:#fff}
.btn-ghost{background:#fff}

/* 品項卡 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.item{background:#fff;border:1.5px solid #e0e0e0;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(0,0,0,.06);transition:border-color .15s,box-shadow .15s}
.item.on{border-color:#cc0000;box-shadow:0 2px 14px rgba(204,0,0,.18)}
.thumb{width:100%;aspect-ratio:4/5;background:#fff;display:block;object-fit:contain;cursor:zoom-in;border-bottom:1px solid #eee}
.item-body{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.item-name{font-size:13px;font-weight:700;line-height:1.4;min-height:36px;word-break:break-all}
.qty{display:flex;align-items:center;gap:6px;margin-top:auto}
.qbtn{width:32px;height:32px;border-radius:8px;border:1.5px solid #ddd;background:#f7f7f7;font-size:18px;font-weight:700;line-height:1;cursor:pointer;color:#333;flex-shrink:0}
.qbtn:active{background:#eee}
.qbtn.plus{background:#cc0000;border-color:#cc0000;color:#fff}
.qty input{flex:1;min-width:0;text-align:center;padding:6px 2px;font-size:15px;font-weight:700}

/* 底部列 */
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1.5px solid #e0e0e0;padding:10px 16px;box-shadow:0 -2px 14px rgba(0,0,0,.1);z-index:40}
.bar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar-info{font-size:13px;color:#555;flex:1}
.bar-info b{color:#cc0000;font-size:16px}

/* 燈箱 / 彈窗 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.mask.show{display:flex}
.mask img{max-width:100%;max-height:86vh;border-radius:10px;background:#fff}
.sheet{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:20px}
.sheet h3{font-size:17px;margin-bottom:12px}
.sum-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed #eee;font-size:14px}
.sum-row b{color:#cc0000}
.note{background:#fff2f2;border:1px solid #ffcccc;border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.6;color:#444;margin-top:12px}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:120px}
.empty{text-align:center;color:#888;padding:30px 0;font-size:14px}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:420px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.item-name{font-size:12px}}
</style>
</head>
<body>

<header>
  <div class="h-row">
    <svg class="logo" viewBox="0 0 36 48" xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="2" width="28" height="14" rx="7" fill="#cc0000" opacity=".9"/>
      <rect x="13" y="15" width="10" height="7" rx="2" fill="#cc0000" opacity=".8"/>
      <rect x="12" y="21" width="12" height="19" rx="3" fill="#cc0000" opacity=".8"/>
      <path d="M12 26 Q18 28.5 24 26M12 30 Q18 32.5 24 30M12 34 Q18 36.5 24 34" stroke="#cc0000" stroke-width="1.8" fill="none"/>
      <path d="M12 40 L18 46 L24 40 Z" fill="#cc0000" opacity=".8"/>
    </svg>
    <div>
      <h1>行銷品訂購單</h1>
      <div class="sub">Nobel Biocare · 診所衛教與陳列用品</div>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="form-card">
    <div class="form-grid">
      <div><label class="req">客戶名稱</label><input type="text" id="clinic" list="custList" placeholder="輸入關鍵字選擇客戶" autocomplete="off"><div class="hint" id="custHint">從客戶清單選擇，送出時自動帶入客編／電話／地址</div></div>
      <div><label class="req">寄送診所</label><input type="text" id="ship" list="custList" placeholder="實際收件的診所" autocomplete="off"></div>
    </div>
    <datalist id="custList"></datalist>
    <div style="margin-top:12px"><label>備註</label><textarea id="memo" rows="2" placeholder="例：下週三前送達，先給少量試放"></textarea></div>
  </div>

  <div class="toolbar">
    <input class="search" type="text" id="q" placeholder="🔍 搜尋品名（例：植牙、海報）">
    <button class="btn btn-ghost" id="onlySel">只看已選</button>
    <button class="btn btn-ghost" id="clearAll">清除數量</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="noResult" style="display:none">找不到符合的品項</div>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="bar-info">已選 <b id="cntItems">0</b> 項 · 共 <b id="cntQty">0</b> 件</div>
    <button class="btn btn-ghost" id="viewList">查看清單</button>
    <button class="btn btn-primary" id="submitBtn">送出</button>
  </div>
</div>

<div class="mask" id="lightbox"><img id="lbImg" alt=""></div>

<div class="mask" id="listModal">
  <div class="sheet">
    <h3>訂購清單確認</h3>
    <div id="sumHead" style="font-size:13px;color:#555;margin-bottom:10px"></div>
    <div id="sumBody"></div>
    <div class="note" id="cfgNote"></div>
    <div class="actions">
      <button class="btn btn-ghost" id="copyBtn">複製文字</button>
      <button class="btn btn-ghost" id="csvBtn">匯出 CSV</button>
      <button class="btn btn-primary" id="sendBtn">送出</button>
    </div>
    <div class="actions"><button class="btn btn-ghost" id="closeList">關閉</button>
    <button class="btn btn-ghost" id="cfgBtn">設定傳送網址</button>
    <button class="btn btn-ghost" id="testBtn">測試連線</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

const LS_URL = 'nb_mk_endpoint', LS_DRAFT = 'nb_mk_draft';
const qty = {};
const $ = id => document.getElementById(id);
function store(k,v){try{v===undefined?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function load(k){try{const v=localStorage.getItem(k); if(k===LS_URL) return (v===null?DEFAULT_URL:v); return v}catch(e){return k===LS_URL?DEFAULT_URL:null}}

/* ── 產生卡片 ── */
const grid = $('grid');
ITEMS.forEach((it,i) => {
  qty[it.name] = 0;
  const el = document.createElement('div');
  el.className = 'item'; el.dataset.name = it.name; el.dataset.idx = i;
  el.innerHTML =
    '<img class="thumb" src="'+it.img+'" alt="'+it.name+'" loading="lazy">' +
    '<div class="item-body"><div class="item-name">'+it.name+'</div>' +
    '<div class="qty"><button class="qbtn minus">−</button>' +
    '<input type="number" min="0" step="1" value="0" inputmode="numeric">' +
    '<button class="qbtn plus">＋</button></div></div>';
  grid.appendChild(el);
  const input = el.querySelector('input');
  const set = v => { v = Math.max(0, parseInt(v)||0); qty[it.name]=v; input.value=v; el.classList.toggle('on', v>0); refresh(); };
  el.querySelector('.minus').onclick = () => set(qty[it.name]-1);
  el.querySelector('.plus').onclick  = () => set(qty[it.name]+1);
  input.onchange = () => set(input.value);
  el.querySelector('.thumb').onclick = () => { $('lbImg').src = it.img; $('lightbox').classList.add('show'); };
});

/* ── 統計 / 篩選 ── */
let onlySelected = false;
function selected(){ return ITEMS.filter(it => qty[it.name] > 0).map(it => ({name:it.name, n:qty[it.name]})); }
function refresh(){
  const s = selected();
  $('cntItems').textContent = s.length;
  $('cntQty').textContent = s.reduce((a,b)=>a+b.n,0);
  filter();
  saveDraft();
}
function filter(){
  const kw = $('q').value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll('.item').forEach(el => {
    const name = el.dataset.name;
    const ok = (!kw || name.toLowerCase().includes(kw)) && (!onlySelected || qty[name] > 0);
    el.style.display = ok ? '' : 'none'; if (ok) shown++;
  });
  $('noResult').style.display = shown ? 'none' : 'block';
}
$('q').oninput = filter;
$('onlySel').onclick = e => { onlySelected = !onlySelected; e.target.classList.toggle('btn-primary', onlySelected); e.target.textContent = onlySelected ? '顯示全部' : '只看已選'; filter(); };
$('clearAll').onclick = () => { if(!confirm('清除所有數量？')) return;
  ITEMS.forEach(it => qty[it.name]=0);
  document.querySelectorAll('.item').forEach(el => { el.querySelector('input').value=0; el.classList.remove('on'); });
  refresh(); };

/* ── 草稿 ── */
function saveDraft(){
  store(LS_DRAFT, JSON.stringify({clinic:$('clinic').value,ship:$('ship').value,memo:$('memo').value,qty:qty}));
}
['clinic','ship','memo'].forEach(id => $(id).oninput = saveDraft);
(function restore(){
  const d = load(LS_DRAFT); if(!d) return;
  try{ const o = JSON.parse(d);
    ['clinic','ship','memo'].forEach(k => { if(o[k]) $(k).value = o[k]; });
    document.querySelectorAll('.item').forEach(el => { const n = el.dataset.name;
      if(o.qty && o.qty[n]>0){ qty[n]=o.qty[n]; el.querySelector('input').value=o.qty[n]; el.classList.add('on'); } });
  }catch(e){}
  refresh();
})();

}

  return ['【Nobel Biocare 行銷品訂購】','客戶名稱：'+(p.clinic||'—'),'寄送診所：'+(p.ship||'—'),'—'.repeat(12),
    ...p.items.map(x => x.name+' × '+x.n), '—'.repeat(12), '合計 '+p.total+' 件',
    p.memo ? '備註：'+p.memo : ''].filter(Boolean).join('\n');
}
$('copyBtn').onclick = () => {
  const t = textList();
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast('已複製清單'),()=>fallbackCopy(t));
  else fallbackCopy(t);
};
function fallbackCopy(t){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
  ta.select(); try{document.execCommand('copy'); toast('已複製清單');}catch(e){toast('複製失敗，請手動選取');} ta.remove(); }

$('csvBtn').onclick = () => {
  const p = payload();
  const rows = [['客戶名稱','寄送診所','行銷品','數量','備註','建立時間']];
  p.items.forEach(x => rows.push([p.clinic,p.ship,x.name,x.n,p.memo,p.ts]));
  const csv = '﻿' + rows.map(r => r.map(c => '"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = '行銷品訂購_' + (p.clinic||'未填') + '_' + p.ts.slice(0,10) + '.csv';
  a.click(); URL.revokeObjectURL(a.href); toast('CSV 已下載');
};

$('cfgBtn').onclick = () => {
  const cur = load(LS_URL) || '';
  const v = prompt('貼上 Google Apps Script 網頁應用程式網址（/exec 結尾）：\n留空可清除設定', cur);
  if(v === null) return;
  store(LS_URL, v.trim() || DEFAULT_URL);
  toast(v.trim() ? '已儲存傳送網址' : '已還原預設網址');
  openList();
};

$('testBtn').onclick = () => {
  const url = load(LS_URL);
  if(!url){ toast('尚未設定傳送網址'); return; }
  window.open(url, '_blank');
  toast('新分頁若顯示「運作中」代表設定正確');
};

/* 以隱藏表單 POST，不受 CORS 限制，file:// 直接開也能送 */
$('sendBtn').onclick = () => {
  const url = load(LS_URL);
  if(!url){ toast('尚未設定傳送網址'); return; }
  if(!/^https:\/\/script\.google(usercontent)?\.com\/.*\/exec/.test(url)){
    if(!confirm('傳送網址看起來不是 Apps Script 的 /exec 網址，仍要送出嗎？\n\n目前設定：\n' + url)) return;
  }
  const p = payload();
  if(!p.clinic){ toast('請先填客戶名稱'); return; }
  if(!p.ship){ toast('請先填寄送診所'); return; }
  if(!p.items.length){ toast('還沒有選擇品項'); return; }

  $('sendBtn').disabled = true; $('sendBtn').textContent = '送出中…';
  const done = ok => { $('sendBtn').disabled = false; $('sendBtn').textContent = '送出';
    if(ok){ toast('已送出，請到試算表確認'); $('listModal').classList.remove('show'); }
    else { toast('送出失敗，請按「測試連線」檢查，或改用匯出 CSV'); } };

  const fid = 'nbsend_' + Date.now();
  const ifr = document.createElement('iframe');
  ifr.name = fid; ifr.style.display = 'none';
  document.body.appendChild(ifr);
  const form = document.createElement('form');
  form.action = url; form.method = 'POST'; form.target = fid; form.style.display = 'none';
  const inp = document.createElement('input');
  inp.type = 'hidden'; inp.name = 'payload'; inp.value = JSON.stringify(p);
  form.appendChild(inp); document.body.appendChild(form);

  let finished = false;
  const finish = ok => { if(finished) return; finished = true; done(ok);
    setTimeout(()=>{ form.remove(); ifr.remove(); }, 1000); };
  ifr.onload = () => finish(true);
  ifr.onerror = () => finish(false);
  setTimeout(() => finish(true), 8000);   // Apps Script 回應被跨網域擋住時，視為已送達
  form.submit();
};

let tt;
function toast(m){ const el=$('toast'); el.textContent=m; el.classList.add('show');
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2000); }

(function initCust(){
  const dl = $('custList');
  CUSTOMERS.forEach(n => { const o = document.createElement('option'); o.value = n; dl.appendChild(o); });
  const chk = () => { const v = $('clinic').value.trim(); const h = $('custHint');
    if(!v){ h.className='hint'; h.textContent='從客戶清單選擇，送出時自動帶入客編／電話／地址'; return; }
    if(CUSTOMERS.indexOf(v) >= 0){ h.className='hint ok'; h.textContent='✓ 已對到客戶清單'; }
    else { h.className='hint warn'; h.textContent='⚠ 不在客戶清單中，客編／電話／地址將留空'; } };
  $('clinic').addEventListener('input', chk); chk();
})();

refresh();
</script>
